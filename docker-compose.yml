version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aiogram_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
  db:
    image: postgres:15
    container_name: aiogram_postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d botdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: botdb
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiogram_bot
    restart: always
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://botuser:botpass@db:5432/botdb
    volumes:
      - .:/app
    command: ["python", "start_bot.py"]

volumes:
  redisdata:
  pgdata:
